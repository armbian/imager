name: "Maintenance: PR check"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".env*"
      - ".github/**"
      - "images/**"
      - "scripts/**"
      - "releases/**"
      - "build/**"
      - "dist/**"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.svg"
      - "*.ico"

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

run-name: "PR #${{ github.event.pull_request.number }}"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TAURI_CLI_VERSION: '2.9.6'

jobs:
  # ===========================================
  # Frontend Checks (runs once, platform-independent)
  # ===========================================
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ===========================================
  # Rust Checks (runs once, platform-independent)
  # ===========================================
  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
          shared-key: "v1-linux-x64"

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Release builds compile without the debug-only dev scenarios emulator; lint and test that cfg too.
      - name: Run Clippy (release)
        working-directory: src-tauri
        run: cargo clippy --release --all-targets --all-features -- -D warnings

      - name: Run tests (release)
        working-directory: src-tauri
        run: cargo test --release

  # ===========================================
  # Build Test - All Platforms
  # ===========================================
  build:
    name: Build (${{ matrix.platform }})
    needs: [frontend, rust-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - platform: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

          # Windows x64
          - platform: windows-x64
            os: windows-latest
            bundles: nsis
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe

          # macOS Apple Silicon
          - platform: macos-arm
            os: macos-latest
            bundles: dmg
            artifact_path: |
              src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set trunk version and disable signing/updater
        shell: bash
        run: |
          VERSION="0.0.0-pr.${{ github.event.pull_request.number }}"
          echo "Setting version to $VERSION"
          echo "Disabling code signing and updater for test builds"

          # Update version in package.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

          # Update version and disable updater in tauri.conf.json
          # macOS: ad-hoc signing for test builds (no secrets)
          jq --arg v "$VERSION" '
            .version = $v |
            .bundle.createUpdaterArtifacts = false |
            .bundle.macOS.signingIdentity = "-" |
            .plugins.updater.endpoints = []
          ' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

          # Update version in Cargo.toml (no jq for TOML, use sed)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi

          echo "=== Configuration updated ==="
          echo "package.json version: $(jq -r '.version' package.json)"
          echo "tauri.conf.json version: $(jq -r '.version' src-tauri/tauri.conf.json)"
          echo "createUpdaterArtifacts: $(jq -r '.bundle.createUpdaterArtifacts' src-tauri/tauri.conf.json)"
          echo "updater endpoints: $(jq -r '.plugins.updater.endpoints' src-tauri/tauri.conf.json)"
          grep "^version" src-tauri/Cargo.toml

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
          shared-key: "v1-${{ matrix.platform }}"

      - name: Cache Tauri CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: tauri-cli-${{ matrix.platform }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked
          fi

      - name: Build application
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Check release binary has no dev scenarios
        shell: bash
        run: ./scripts/build/check-release-binary.sh src-tauri/target/release/armbian-imager

      - name: Check frontend bundle has no dev scenarios
        shell: bash
        run: ./scripts/build/check-release-dist.sh dist

      # See scripts/build/appimage-unbundle-wayland.sh — bundled libwayland aborts
      # EGL init on the user's Wayland session (issue #67). Keeps the AppImage that
      # reviewers download from this PR usable on modern distros.
      - name: Un-bundle libwayland from AppImage (#67)
        if: runner.os == 'Linux'
        run: ./scripts/build/appimage-unbundle-wayland.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

  # ===========================================
  # Security Audit
  # ===========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      # Ignore list and unsound/yanked deny live in src-tauri/.cargo/audit.toml
      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit
