name: "Maintenance: PR check"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".env*"
      - "images/**"
      - "releases/**"
      - "build/**"
      - "dist/**"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.svg"
      - "*.ico"
  # Pushes to main only warm the caches; PR runs restore them (PR caches are not shared across PRs).
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".env*"
      - "images/**"
      - "releases/**"
      - "build/**"
      - "dist/**"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.svg"
      - "*.ico"

# Cancel superseded runs of the same PR; pushes to main never cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

run-name: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('main {0}', github.sha) }}"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================
  # Frontend Checks (runs once, platform-independent)
  # ===========================================
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Save npm cache
        if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Check locale parity
        run: node scripts/locales/check-parity.mjs

      - name: Check version sync
        run: bash scripts/build/check-version-sync.sh

  # ===========================================
  # Rust Checks (runs once, platform-independent)
  # ===========================================
  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Save npm cache
        if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: "v1-linux-x64-lint"

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Release builds compile without the debug-only dev scenarios emulator; lint and test that cfg too.
      - name: Run Clippy (release)
        working-directory: src-tauri
        run: cargo clippy --release --all-targets --all-features -- -D warnings

      - name: Run tests (release)
        working-directory: src-tauri
        run: cargo test --release

  # cfg(windows) code is never compiled by the Linux lint job.
  rust-lint-windows:
    name: Rust Lint (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # generate_context!() only needs the frontendDist directory to exist.
      - name: Create empty frontend dist
        shell: bash
        run: mkdir -p dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: "v1-windows-x64-lint"

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Clippy (release)
        working-directory: src-tauri
        run: cargo clippy --release --all-targets --all-features -- -D warnings

  # ===========================================
  # Build Test - All Platforms
  # ===========================================
  build:
    name: Build (${{ matrix.platform }})
    needs: [frontend, rust-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - platform: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

          # Windows x64
          - platform: windows-x64
            os: windows-latest
            bundles: nsis
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe

          # macOS Apple Silicon
          - platform: macos-arm
            os: macos-latest
            bundles: dmg
            artifact_path: |
              src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set trunk version and disable signing/updater
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            VERSION="0.0.0-pr.${{ github.event.pull_request.number }}"
          else
            VERSION="0.0.0-main.${{ github.run_number }}"
          fi
          echo "Setting version to $VERSION"
          echo "Disabling code signing and updater for test builds"

          # Update version in package.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

          # Update version and disable updater in tauri.conf.json
          # macOS: ad-hoc signing for test builds (no secrets)
          jq --arg v "$VERSION" '
            .version = $v |
            .bundle.createUpdaterArtifacts = false |
            .bundle.macOS.signingIdentity = "-" |
            .plugins.updater.endpoints = []
          ' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

          # Update version in Cargo.toml (no jq for TOML, use sed)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi

          echo "=== Configuration updated ==="
          echo "package.json version: $(jq -r '.version' package.json)"
          echo "tauri.conf.json version: $(jq -r '.version' src-tauri/tauri.conf.json)"
          echo "createUpdaterArtifacts: $(jq -r '.bundle.createUpdaterArtifacts' src-tauri/tauri.conf.json)"
          echo "updater endpoints: $(jq -r '.plugins.updater.endpoints' src-tauri/tauri.conf.json)"
          grep "^version" src-tauri/Cargo.toml

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\npm-cache' || '~/.npm' }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: "v1-${{ matrix.platform }}"

      - name: Install dependencies
        run: npm ci

      - name: Save npm cache
        if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\npm-cache' || '~/.npm' }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build application
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Check release binary has no dev scenarios
        shell: bash
        run: ./scripts/build/check-release-binary.sh src-tauri/target/release/armbian-imager

      - name: Check frontend bundle has no dev scenarios
        shell: bash
        run: ./scripts/build/check-release-dist.sh dist

      # See scripts/build/appimage-unbundle-wayland.sh — bundled libwayland aborts
      # EGL init on the user's Wayland session (issue #67). Keeps the AppImage that
      # reviewers download from this PR usable on modern distros.
      - name: Un-bundle libwayland from AppImage (#67)
        if: runner.os == 'Linux'
        run: ./scripts/build/appimage-unbundle-wayland.sh

      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

  # ===========================================
  # Security Audit
  # ===========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Save npm cache
        if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Ignore list and unsound/yanked deny live in src-tauri/.cargo/audit.toml
      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit
