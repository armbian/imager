version: 2
updates:
  # ===========================================
  # NPM Dependencies (Root package.json)
  # ===========================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # Majors come as single PRs; minors and patches are grouped
    groups:
      dev-tooling:
        patterns:
          - "@types/*"
          - "@eslint/*"
          - "@vitejs/*"
          - "eslint*"
          - "globals"
          - "typescript"
          - "typescript-eslint"
          - "vite"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Tauri crates and @tauri-apps packages must share a minor or tauri build fails: bump those by hand
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    rebase-strategy: "auto"

  # ===========================================
  # Rust/Cargo Dependencies (src-tauri/Cargo.toml)
  # ===========================================
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # flate2 (gzip images) and nusb (QDL transport) sit on write paths: single PRs, tested on hardware
    groups:
      rust-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "flate2"
          - "nusb"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "tauri-build"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "tauri-plugin-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # zbus is pinned and moves only together with a udisks2 major
      - dependency-name: "zbus"
      - dependency-name: "udisks2"
        update-types: ["version-update:semver-major"]
      # qdlrs is pinned to a reviewed git rev (UFS provisioning path)
      - dependency-name: "qdl"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    rebase-strategy: "auto"

  # ===========================================
  # GitHub Actions Dependencies
  # ===========================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    rebase-strategy: "auto"
